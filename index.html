<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Web Rider">
  <meta name="description" content="A neon motorcycle stunt game.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <title>Web Rider</title>
</head>
<body>
  <script>
  /* Boot diagnostics: prints errors and boot state directly on screen. */
  (function () {
    function box() {
      var b = document.getElementById('boot-errors');
      if (!b && document.body) {
        b = document.createElement('div');
        b.id = 'boot-errors';
        b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;' +
          'background:rgba(40,0,10,.95);color:#ffb3c0;font:12px/1.4 monospace;padding:10px;' +
          'border:1px solid #ff304f;white-space:pre-wrap;max-height:50vh;overflow:auto;pointer-events:auto;';
        document.body.appendChild(b);
      }
      return b;
    }
    function log(msg) { var b = box(); if (b) b.textContent += (b.textContent ? '\n\n' : '') + msg; }
    window.addEventListener('error', function (e) {
      if (e.target && (e.target.src || e.target.href)) {
        log('FAILED TO LOAD: ' + (e.target.src || e.target.href));
      } else {
        log((e.message || 'Error') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      log('PROMISE REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });
    window.addEventListener('load', function () {
      setTimeout(function () {
        var r = document.getElementById('ui-root');
        var t = r && r.querySelector ? r.querySelector('.screen-title') : null;
        log('BOOT PROBE: UIManager=' + (typeof UIManager) +
            ' CONFIG=' + (typeof CONFIG) +
            ' LEVELS=' + (typeof LEVELS) +
            ' uiRootChildren=' + (r ? r.children.length : 'NO #ui-root') +
            ' titleClass=' + (t ? t.className : 'n/a') +
            ' titleHtmlLen=' + (t ? t.innerHTML.length : 'n/a'));
      }, 1500);
    });
  })();
  </script>
  <main id="app">
    <canvas id="game-canvas" aria-label="Web Rider game"></canvas>
    <div id="ui-root" aria-live="polite"></div>
    <div id="rotate-overlay" role="status">
      <div class="rotate-card">
        <span class="rotate-icon">↻</span>
        <strong>Rotate your device</strong>
        <span>Web Rider plays best in landscape</span>
      </div>
    </div>
  </main>

  <!-- Keep this order: the existing modules expose browser globals. -->
  <script src="./js/config.js"></script>
  <script src="./js/planck.min.js"></script>
  <script src="./js/physics.js"></script>
  <script src="./js/vehicle.js"></script>
  <script src="./js/track-pieces.js"></script>
  <script src="./js/track.js"></script>
  <script src="./js/camera.js"></script>
  <script src="./js/particles.js"></script>
  <script src="./js/renderer.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/input.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/stunts.js"></script>
  <script src="./js/challenges.js"></script>
  <script src="./js/levels.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
